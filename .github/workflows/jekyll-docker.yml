name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the site in the jekyll/builder container
      run: |
        docker run --rm \
          --volume="${{ github.workspace }}:/srv/jekyll:Z" \
          --env JEKYLL_ENV=production \
          jekyll/builder:latest jekyll build
